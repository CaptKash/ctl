kind = "video"
previewPath = "/ctl-promo-video/"
title = "CTL Promo Video"
version = "1.0.0"
id = "artifacts/ctl-promo-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/ctl-promo-video/" ]
localPort = 24093

[services.development]
run = "pnpm --filter @workspace/ctl-promo-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ctl-promo-video", "run", "build" ]
publicDir = "artifacts/ctl-promo-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24093"
BASE_PATH = "/ctl-promo-video/"
